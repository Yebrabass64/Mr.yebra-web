    <a class="platform-btn" href="go/spotify.html" target="_blank" rel="noopener noreferrer"

  </main>

  <script>
    // Menú hamburguesa
    const menuToggle = document.getElementById('menu-toggle');
    const mainMenu = document.querySelector('.main-menu');
    if (menuToggle && mainMenu) {
      menuToggle.addEventListener('click', () => mainMenu.classList.toggle('active'));
    }

    // GA4 evento (se mantiene)
    document.querySelectorAll('.platform-btn').forEach(link => {
      link.addEventListener('click', () => {
        gtag('event', 'platform_click', {
          platform: link.dataset.platform,
          song: link.dataset.song,
          destination_url: link.href,
          page_section: 'plataformas',
          transport_type: 'beacon'
        });
      });
    });
  </script>

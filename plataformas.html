  <script>
    // Menú hamburguesa
    const menuToggle = document.getElementById('menu-toggle');
    const mainMenu = document.querySelector('.main-menu');
    if (menuToggle && mainMenu) {
      menuToggle.addEventListener('click', () => mainMenu.classList.toggle('active'));
    }

    // Eventos por clic en plataformas (GA4 + Meta Pixel)
    document.querySelectorAll('.platforms .platform-btn').forEach(link => {
      link.addEventListener('click', () => {

        // GA4
        gtag('event', 'platform_click', {
          platform: link.dataset.platform || 'desconocida',
          song: link.dataset.song || '',
          destination_url: link.href,
          page_section: 'plataformas',
          transport_type: 'beacon'
        });

        // META PIXEL – SOLO CLICK REAL
        if (typeof fbq === 'function') {
          fbq('trackCustom', 'SubscribedButtonClick', {
            platform: link.dataset.platform || 'desconocida',
            song: link.dataset.song || '',
            destination_url: link.href
          });
        }

      });
    });
  </script>
